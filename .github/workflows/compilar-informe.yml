name: Compilar Informe LaTeX

# Compila el informe P2515-PR-INF-001 en la nube (TeX Live completo),
# lo publica como artefacto descargable y ademas commitea el PDF de vuelta al repo
# para poder verlo con un clic (GitHub lo muestra incrustado en el navegador).
# No requiere TeX instalado en local.

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'FORMATO LATEX CON ENCABEZADO/**'
      - '.github/workflows/compilar-informe.yml'
  pull_request:
    paths:
      - 'FORMATO LATEX CON ENCABEZADO/**'
      - '.github/workflows/compilar-informe.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # latexmk encadena pdflatex -> bibtex -> pdflatex -> pdflatex automaticamente,
      # resolviendo las citas (elsarticle-num) y las referencias cruzadas (TOC/LOT/LOF).
      - name: Compilar con latexmk (TeX Live completo)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: "FORMATO LATEX CON ENCABEZADO"
          root_file: main.tex
          latexmk_use_xelatex: false
          args: -pdf -jobname=P2515-PR-INF-001 -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Publicar PDF como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: P2515-PR-INF-001
          path: "FORMATO LATEX CON ENCABEZADO/P2515-PR-INF-001.pdf"
          if-no-files-found: error

      # Commitea el PDF compilado de vuelta a la rama para verlo con un clic en GitHub.
      # Solo en push (no en pull_request). Usa GITHUB_TOKEN, que NO re-dispara el
      # workflow, evitando bucles de ejecucion. El [skip ci] es una salvaguarda adicional.
      - name: Versionar PDF en el repositorio
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(build): PDF compilado de ${{ github.sha }} [skip ci]"
          file_pattern: "FORMATO LATEX CON ENCABEZADO/P2515-PR-INF-001.pdf"

      # Si la compilacion falla, sube el .log para diagnostico.
      - name: Publicar log en caso de fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: "FORMATO LATEX CON ENCABEZADO/*.log"
          if-no-files-found: ignore
